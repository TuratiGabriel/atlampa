<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Personas · prueba</title>
<style>body{margin:0;background:#000}svg{display:block;width:100vw;height:100vh}path{vector-effect:non-scaling-stroke}.f{fill:#e8e8e8}.l{fill:none;stroke:#e8e8e8;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round}text{fill:#888;font:11px sans-serif}</style></head>
<body><svg id="s" viewBox="-0.6 -2.6 20 9"></svg>
<script src="../atlampa-personas.js"></script>
<script>
// Hoja de prueba: los 16 tipos, cuadro a arriba y cuadro b abajo (abrir con el servidor del diagrama)
var s = document.getElementById('s'), NS = 'http://www.w3.org/2000/svg', T = window.ATLAMPA_PERSONAS.tipos, i = 0;
Object.keys(T).forEach(function (k) {
  ['a', 'b'].forEach(function (fa, j) {
    var g = document.createElementNS(NS, 'g'), c = T[k](fa);
    g.setAttribute('transform', 'translate(' + (i % 8) * 2.4 + ' ' + (Math.floor(i / 8) * 4.4 + j * 2.1) + ')');
    [['f', c.f], ['l', c.l]].forEach(function (p) { var e = document.createElementNS(NS, 'path'); e.setAttribute('class', p[0]); e.setAttribute('d', p[1]); g.appendChild(e); });
    if (!j) { var t = document.createElementNS(NS, 'text'); t.textContent = k; t.setAttribute('y', 0.3); t.setAttribute('transform', 'scale(0.02)'); t.setAttribute('x', 0); t.setAttribute('y', 18); g.appendChild(t); }
    s.appendChild(g);
  });
  i++;
});
</script></body></html>
